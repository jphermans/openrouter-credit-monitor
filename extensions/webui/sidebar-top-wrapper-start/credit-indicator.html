<script type="module">
  import { store } from "/plugins/openrouter_credit_monitor/webui/credit-monitor-store.js";
</script>

<div x-data>
  <template x-if="$store.openrouterCreditStore">
    <div class="ocr-indicator-root"
         x-create="$store.openrouterCreditStore.onOpen()"
         x-destroy="$store.openrouterCreditStore.cleanup()"
         @click.outside="$store.openrouterCreditStore.open = false"
         @keydown.escape.window="$store.openrouterCreditStore.open = false">
      <template x-if="$store.openrouterCreditStore.indicatorVisible">
      <button type="button"
              class="ocr-indicator"
              :class="$store.openrouterCreditStore.statusClass"
              :aria-label="`OpenRouter balance ${$store.openrouterCreditStore.balanceLabel}`"
              :title="`OpenRouter balance ${$store.openrouterCreditStore.balanceLabel}`"
              @click="$store.openrouterCreditStore.toggle()">
        <x-icon name="account_balance_wallet" aria-hidden="true"></x-icon>
        <span class="ocr-provider">OpenRouter</span>
        <span class="ocr-value" x-text="$store.openrouterCreditStore.balanceLabel"></span>
        <span class="ocr-status-chip" x-show="$store.openrouterCreditStore.statusLabel"
              x-text="$store.openrouterCreditStore.statusLabel"></span>
      </button>
      </template>

      <div class="ocr-popover"
           x-show="$store.openrouterCreditStore.open"
           x-transition.opacity
           style="display: none;"
           role="dialog"
           aria-label="OpenRouter credit details">
        <div class="ocr-popover-header">
          <strong>OpenRouter credits</strong>
          <button type="button" class="ocr-refresh"
                  title="Refresh now"
                  :aria-label="'Refresh now'"
                  :disabled="$store.openrouterCreditStore.busy"
                  @click="$store.openrouterCreditStore.manualRefresh()">
            <x-icon name="refresh" aria-hidden="true"></x-icon>
          </button>
        </div>

        <template x-if="$store.openrouterCreditStore.status === 'not_configured'">
          <div class="ocr-row ocr-setup">
            <span>Add an OpenRouter Management Key to see your balance.</span>
            <button type="button" class="btn" @click="$store.openrouterCreditStore.openSettings()">Open settings</button>
          </div>
        </template>

        <template x-if="$store.openrouterCreditStore.status !== 'not_configured'">
          <div class="ocr-rows">
            <div class="ocr-row">
              <span>Account</span>
              <span class="ocr-value-strong" x-text="$store.openrouterCreditStore.keyLabel || 'OpenRouter'"></span>
            </div>
            <div class="ocr-row">
              <span>Remaining</span>
              <span class="ocr-value-strong" x-text="$store.openrouterCreditStore.balanceLabel"></span>
            </div>
            <div class="ocr-row">
              <span>State</span>
              <span class="ocr-value-strong" x-text="$store.openrouterCreditStore.statusLabel || 'OK'"></span>
            </div>
            <div class="ocr-row">
              <span>Updated</span>
              <span class="ocr-value-strong" x-text="$store.openrouterCreditStore.lastUpdatedLabel || 'just now'"></span>
            </div>
          </div>
        </template>

        <button type="button" class="ocr-settings-link" @click="$store.openrouterCreditStore.openSettings()">
          <x-icon name="settings" aria-hidden="true"></x-icon>
          <span>Plugin settings</span>
        </button>
      </div>
    </div>
  </template>
</div>
